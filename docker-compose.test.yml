services:
  postgres-test:
    image: ghcr.io/seuros/postgis-with-extensions:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaunta_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaunta_test"]
      interval: 5s
      timeout: 5s
      retries: 5
