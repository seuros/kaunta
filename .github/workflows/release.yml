name: Release

on:
  release:
    types: [published]
  # release-please publishes with GITHUB_TOKEN, and GitHub refuses to raise
  # workflow events from its own token, so that release never reaches the
  # trigger above. Re-run this by hand with the tag it skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the assets to, e.g. v0.121.0
        required: true
      ref:
        description: Ref to build, when the tag's tree predates a CI fix
        required: false
      push_image:
        description: Also rebuild and push the container image
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # What gets built; RELEASE_TAG is only what the assets land on.
  RELEASE_REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}

jobs:
  build-binaries:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than 24.04: the binaries then need glibc 2.35, not
          # 2.39, and the platform gems ship these same files.
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          # Built in a FreeBSD VM, so bindgen reads the real resolv.h.
          - runner: ubuntu-24.04
            os: freebsd
            arch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@v1
        if: matrix.os != 'freebsd'
        with:
          toolchain: 1.99.0
      - name: Validate release version
        shell: bash
        run: |
          # The trailing .* drops release-please's x-release-please-version marker.
          manifest_version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test "v${manifest_version}" = "${RELEASE_TAG}"
      - name: Build binary
        if: matrix.os != 'freebsd'
        shell: bash
        run: |
          cargo build --release -p kaunta
          cp target/release/kaunta kaunta
      - name: Build binary on FreeBSD 15
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          # The newest 15.x: packages are built on it once the older minor
          # is EOL. A 15 binary needs symbols 14 lacks, hence the gem's -15.
          release: "15"
          mem: 12288
          prepare: pkg install -y curl llvm
          run: |
            set -eu
            # rama-dns runs bindgen on the BSDs; point it at the llvm package.
            LIBCLANG_PATH=$(dirname "$(ls /usr/local/llvm*/lib/libclang.so | sort -V | tail -n 1)")
            export LIBCLANG_PATH
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.99.0
            . "$HOME/.cargo/env"
            # Outside the synced tree, or copyback hauls target/ to the host.
            CARGO_TARGET_DIR=/var/tmp/kaunta-target cargo build --release -p kaunta
            cp /var/tmp/kaunta-target/release/kaunta kaunta
      - name: Check the glibc floor
        if: matrix.os == 'linux'
        shell: bash
        run: |
          # Guards the runner choice above: a newer image would raise this
          # without anything else failing.
          floor=2.35
          needed=$(objdump -T kaunta | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          echo "kaunta needs glibc ${needed}"
          test "$(printf '%s\n' "${needed}" "${floor}" | sort -V | tail -n 1)" = "${floor}"
      - name: Package binary
        shell: bash
        env:
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          archive="kaunta_${RELEASE_OS}_${RELEASE_ARCH}.tar.gz"
          tar -czf "${archive}" kaunta
          python3 - "${archive}" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_suffix(path.suffix + ".sha256").write_text(
              f"{digest}  {path.name}\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: kaunta-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            kaunta_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            kaunta_${{ matrix.os }}_${{ matrix.arch }}.tar.gz.sha256

  upload-release-assets:
    runs-on: ubuntu-24.04
    needs: build-binaries
    # fail-fast is off because the targets are independent; honour that here
    # too, so one broken platform cannot withhold the others' binaries.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${{ github.repository }}" --clobber

  package-gems:
    runs-on: ubuntu-24.04
    # No !cancelled() here, unlike the asset upload: a gem version cannot be
    # amended once pushed, and the stub would stand in for a missing platform.
    needs: build-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build gems
        working-directory: gem
        run: rake build:kaunta:all
      - uses: oras-project/setup-oras@v2
      - name: Push gems to GHCR
        working-directory: gem/pkg
        env:
          GH_TOKEN: ${{ github.token }}
        # Publishing to RubyGems stays manual (MFA): `rake fetch:kaunta release:kaunta`.
        run: |
          echo "${GH_TOKEN}" | oras login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          oras push "${REGISTRY}/${IMAGE_NAME}/gems:${RELEASE_TAG#v}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            kaunta-*.gem

  build-and-push-image:
    runs-on: ubuntu-24.04
    # A rescue dispatch rebuilds binaries and gems only, so it cannot race the image
    # tags with a release run that is still pushing them.
    if: github.event_name == 'release' || inputs.push_image
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image version
        id: version
        shell: bash
        run: |
          # Image tags follow the Go releases (:1.4.0), not the git tag (v1.4.0).
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
