name: Release

on:
  release:
    types: [published]
  # release-please publishes with GITHUB_TOKEN, and GitHub refuses to raise
  # workflow events from its own token, so that release never reaches the
  # trigger above. Re-run this by hand with the tag it skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the assets to, e.g. v0.121.0
        required: true
      ref:
        description: Ref to build, when the tag's tree predates a CI fix
        required: false
      push_image:
        description: Also rebuild and push the container image
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # What gets built; RELEASE_TAG is only what the assets land on.
  RELEASE_REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}

jobs:
  build-binaries:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            command: cargo
            target: ""
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            command: cargo
            target: ""
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            command: cargo
            target: ""
          - runner: macos-15
            os: darwin
            arch: arm64
            command: cargo
            target: ""
          - runner: ubuntu-24.04
            os: freebsd
            arch: amd64
            command: cross
            target: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
      - name: Validate release version
        shell: bash
        run: |
          # The trailing .* drops release-please's x-release-please-version marker.
          manifest_version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          test "v${manifest_version}" = "${RELEASE_TAG}"
      - name: Install cross
        if: matrix.command == 'cross'
        run: cargo install cross --version 0.2.5 --locked
      - name: Build binary
        shell: bash
        env:
          BUILD_COMMAND: ${{ matrix.command }}
          BUILD_TARGET: ${{ matrix.target }}
          # Inert for every other target; Cross.toml passes it into the
          # FreeBSD container, where that sysroot path exists.
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_freebsd: -I/usr/local/x86_64-unknown-freebsd13/include
        run: |
          if [ -n "${BUILD_TARGET}" ]; then
            "${BUILD_COMMAND}" build --release -p kaunta --target "${BUILD_TARGET}"
            cp "target/${BUILD_TARGET}/release/kaunta" kaunta
          else
            "${BUILD_COMMAND}" build --release -p kaunta
            cp target/release/kaunta kaunta
          fi
      - name: Package binary
        shell: bash
        env:
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          archive="kaunta_${RELEASE_OS}_${RELEASE_ARCH}.tar.gz"
          tar -czf "${archive}" kaunta
          python3 - "${archive}" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_suffix(path.suffix + ".sha256").write_text(
              f"{digest}  {path.name}\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: kaunta-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            kaunta_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            kaunta_${{ matrix.os }}_${{ matrix.arch }}.tar.gz.sha256

  upload-release-assets:
    runs-on: ubuntu-24.04
    needs: build-binaries
    # fail-fast is off because the targets are independent; honour that here
    # too, so one broken platform cannot withhold the others' binaries.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${{ github.repository }}" --clobber

  build-and-push-image:
    runs-on: ubuntu-24.04
    # A rescue dispatch rebuilds binaries only, so it cannot race the image
    # tags with a release run that is still pushing them.
    if: github.event_name == 'release' || inputs.push_image
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image version
        id: version
        shell: bash
        run: |
          # Image tags follow the Go releases (:1.4.0), not the git tag (v1.4.0).
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
