name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: ghcr.io/seuros/postgis-with-extensions:18
        env:
          POSTGRES_DB: kaunta_test
          POSTGRES_USER: kaunta
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U kaunta -d kaunta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --no-deps
      - name: Run tests
        run: cargo test --workspace -- --test-threads=1
      - name: Run PostgreSQL regressions
        env:
          KAUNTA_TEST_DATABASE_URL: postgresql://kaunta:test@127.0.0.1:5432/kaunta_test?sslmode=disable
        run: cargo test --workspace database_ -- --ignored --test-threads=1
      - name: Build release binary
        run: cargo build --release -p kaunta
      - name: Run browser e2e suite
        env:
          KAUNTA_E2E_ADMIN_URL: postgresql://kaunta:test@127.0.0.1:5432/kaunta_test?sslmode=disable
          CHROME: /usr/bin/google-chrome
        run: cargo test -p kaunta-e2e -- --ignored --test-threads=1
