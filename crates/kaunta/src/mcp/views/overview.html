<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaunta overview</title>
<style>
__SHARED_CSS__

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile { padding: 10px 12px; border: 1px solid var(--grid); border-radius: var(--radius); background: var(--surface); }
  .tile .label { font-size: 11px; color: var(--ink-2); }
  .tile .value { margin-top: 2px; font-size: 24px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  .tile .delta { font-size: 11px; color: var(--muted); }
  .tile .delta.up { color: var(--up); }
  svg { display: block; width: 100%; height: 120px; overflow: visible; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  td.bar { width: 42%; }
  td.num { width: 56px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .track { height: 6px; border-radius: 3px; background: var(--accent-soft); }
  .track > div { height: 100%; border-radius: 3px; background: var(--accent); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
  <header>
    <h1>Visitors</h1><span class="site" id="site"></span>
    <div class="periods" id="periods" role="group" aria-label="Period"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="panel">
    <h2 id="chart-title">Pageviews over time</h2>
    <figure>
      <svg id="chart" role="img" aria-labelledby="chart-title"></svg>
      <div id="tip" role="status"></div>
    </figure>
    <details><summary>Chart data</summary><table id="series"></table></details>
  </section>

  <div class="cols">
    <section class="panel"><h2>Top pages</h2><div id="pages"></div></section>
    <section class="panel"><h2>Top sources</h2><div id="sources"></div></section>
  </div>

<script type="module">
__BRIDGE_JS__

  let panel = null;
  const compact = (value) =>
    Math.abs(value) >= 1000 ? `${(value / 1000).toFixed(value >= 10000 ? 0 : 1)}K` : String(value);

  function delta(current, previous) {
    if (!previous) return current ? "(new)" : "";
    const pct = Math.round(((current - previous) / previous) * 100);
    return `${pct >= 0 ? "+" : ""}${pct}% vs previous`;
  }

  onToolResult(apply);

  function apply(result) {
    const data = payloadOf(result);
    if (!data || typeof data.pageviews !== "number") return;
    panel = data;
    render();
  }

  function render() {
    el("site").textContent = `· ${panel.website} · last ${panel.period_days} days`;
    renderPeriods(panel, "overview_panel_refresh", (data) => { panel = data; render(); });
    renderTiles();
    renderChart();
    renderRows("pages", panel.top_pages);
    renderRows("sources", panel.top_sources);
  }

  function renderTiles() {
    const tiles = [
      ["Visitors", compact(panel.visitors), delta(panel.visitors, panel.prev_visitors)],
      ["Pageviews", compact(panel.pageviews), delta(panel.pageviews, panel.prev_pageviews)],
      ["Bounce rate", panel.bounce_rate, ""],
      ["Online now", compact(panel.current_visitors), ""],
    ];
    el("tiles").replaceChildren(...tiles.map(([label, value, change]) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      const l = document.createElement("div"); l.className = "label"; l.textContent = label;
      const v = document.createElement("div"); v.className = "value"; v.textContent = value;
      const d = document.createElement("div");
      d.className = change.startsWith("+") ? "delta up" : "delta";
      d.textContent = change;
      tile.append(l, v, d);
      return tile;
    }));
  }

  function renderChart() {
    const svg = el("chart");
    const points = panel.timeseries ?? [];
    svg.replaceChildren();
    if (!points.some((p) => p.value > 0)) {
      const text = document.createElementNS(svg.namespaceURI, "text");
      text.setAttribute("x", "8"); text.setAttribute("y", "60");
      text.setAttribute("fill", "var(--muted)"); text.setAttribute("font-size", "13");
      text.textContent = "No pageviews in this period.";
      svg.append(text);
      el("series").replaceChildren();
      return;
    }
    const W = 800, H = 120, pad = 6;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio", "none");
    const max = Math.max(...points.map((p) => p.value));
    const x = (i) => pad + (i * (W - pad * 2)) / Math.max(1, points.length - 1);
    const y = (v) => H - pad - (v / max) * (H - pad * 2);

    const baseline = document.createElementNS(svg.namespaceURI, "line");
    baseline.setAttribute("x1", 0); baseline.setAttribute("x2", W);
    baseline.setAttribute("y1", H - pad); baseline.setAttribute("y2", H - pad);
    baseline.setAttribute("stroke", "var(--axis)"); baseline.setAttribute("stroke-width", "1");
    svg.append(baseline);

    const area = document.createElementNS(svg.namespaceURI, "path");
    area.setAttribute("d",
      `M ${x(0)} ${H - pad} ` + points.map((p, i) => `L ${x(i)} ${y(p.value)}`).join(" ") +
      ` L ${x(points.length - 1)} ${H - pad} Z`);
    area.setAttribute("fill", "var(--accent-soft)");
    area.setAttribute("opacity", "0.5");
    svg.append(area);

    const line = document.createElementNS(svg.namespaceURI, "polyline");
    line.setAttribute("points", points.map((p, i) => `${x(i)},${y(p.value)}`).join(" "));
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "var(--accent)");
    line.setAttribute("stroke-width", "2");
    line.setAttribute("stroke-linejoin", "round");
    line.setAttribute("vector-effect", "non-scaling-stroke");
    svg.append(line);

    const marker = document.createElementNS(svg.namespaceURI, "circle");
    marker.setAttribute("r", "4");
    marker.setAttribute("fill", "var(--accent)");
    marker.setAttribute("stroke", "var(--surface)");
    marker.setAttribute("stroke-width", "2");
    marker.setAttribute("opacity", "0");
    svg.append(marker);

    const tip = el("tip");
    svg.addEventListener("pointermove", (event) => {
      const box = svg.getBoundingClientRect();
      const ratio = (event.clientX - box.left) / box.width;
      const index = Math.max(0, Math.min(points.length - 1, Math.round(ratio * (points.length - 1))));
      const point = points[index];
      marker.setAttribute("opacity", "1");
      marker.setAttribute("cx", x(index));
      marker.setAttribute("cy", y(point.value));
      tip.style.opacity = "1";
      tip.style.left = `${(x(index) / W) * box.width}px`;
      tip.style.top = `${(y(point.value) / H) * box.height}px`;
      tip.textContent = `${point.value} · ${new Date(point.timestamp).toLocaleString()}`;
    });
    svg.addEventListener("pointerleave", () => {
      marker.setAttribute("opacity", "0");
      tip.style.opacity = "0";
    });

    el("series").replaceChildren(...points.map((point) => {
      const row = document.createElement("tr");
      const when = document.createElement("td");
      when.textContent = new Date(point.timestamp).toLocaleString();
      const value = document.createElement("td");
      value.className = "num"; value.textContent = point.value;
      row.append(when, value);
      return row;
    }));
  }

  function renderRows(id, rows) {
    const host = el(id);
    if (!rows?.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "Nothing in this period.";
      host.replaceChildren(empty);
      return;
    }
    const max = Math.max(...rows.map((row) => row.count));
    const table = document.createElement("table");
    for (const row of rows) {
      const tr = document.createElement("tr");
      const name = document.createElement("td");
      name.className = "name"; name.textContent = row.name; name.title = row.name;
      const bar = document.createElement("td");
      bar.className = "bar";
      const track = document.createElement("div"); track.className = "track";
      const fill = document.createElement("div");
      fill.style.width = `${Math.max(2, (row.count / max) * 100)}%`;
      track.append(fill); bar.append(track);
      const count = document.createElement("td");
      count.className = "num"; count.textContent = row.count;
      tr.append(name, bar, count);
      table.append(tr);
    }
    host.replaceChildren(table);
  }
</script>
</body>
</html>
