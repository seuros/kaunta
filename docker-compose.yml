services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kaunta
      POSTGRES_USER: kaunta
      POSTGRES_PASSWORD: kaunta
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaunta -d kaunta"]
      interval: 10s
      timeout: 5s
      retries: 5

  kaunta:
    image: ghcr.io/seuros/kaunta:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://kaunta:kaunta@postgres:5432/kaunta?sslmode=disable
      PORT: 3100
      DATA_DIR: /var/lib/kaunta
      SECURE_COOKIES: "false"
      TRUSTED_ORIGINS: localhost
    volumes:
      - kaunta_data:/var/lib/kaunta
    ports:
      - "3010:3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kaunta", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  kaunta_data:
